<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>JARVIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --blue:#00c8ff; --blue-dim:#0a5a78; --bg:#000; --glow:0 0 12px rgba(0,200,255,.8), 0 0 32px rgba(0,200,255,.35); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--blue); font-family:'Orbitron','Courier New',monospace; overflow:hidden; user-select:none; }
  #app { height:100dvh; display:flex; flex-direction:column; align-items:center; padding:14px 16px 12px; gap:6px;
         background: radial-gradient(ellipse at 50% 38%, rgba(0,90,130,.28) 0%, rgba(0,0,0,0) 62%), #000; }
  #clock { font-size:44px; font-weight:800; letter-spacing:3px; text-shadow:var(--glow); line-height:1; margin-top:4px; }
  #clock small { font-size:18px; opacity:.7; margin-left:4px; }
  #date { font-size:11px; letter-spacing:4px; opacity:.65; text-transform:uppercase; }
  #greeting { font-size:14px; letter-spacing:2px; text-shadow:var(--glow); margin-top:4px; text-align:center; }
  #orbwrap { flex:1 1 auto; min-height:180px; width:100%; max-width:340px; display:flex; align-items:center; justify-content:center; }
  #orb { width:100%; max-height:100%; aspect-ratio:1/1; }
  #status { font-size:11px; letter-spacing:5px; text-transform:uppercase; opacity:.85; text-shadow:var(--glow); min-height:14px; }
  #log { width:100%; max-width:440px; max-height:21vh; overflow-y:auto; font-family:'Courier New',monospace; font-size:13px; line-height:1.35;
         border:1px solid rgba(0,200,255,.25); border-radius:10px; padding:8px 10px; background:rgba(0,30,45,.35); user-select:text; }
  #log:empty { display:none; }
  .msg { margin:3px 0; color:#bfefff; word-wrap:break-word; }
  .msg .who { color:var(--blue); font-weight:bold; margin-right:6px; text-shadow:0 0 6px rgba(0,200,255,.7); }
  .msg.you { opacity:.75; }
  .msg a { color:#fff; border-bottom:1px solid var(--blue); text-decoration:none; }
  #bar { width:100%; max-width:440px; display:flex; gap:8px; }
  #textin { flex:1; background:rgba(0,30,45,.5); color:#dff6ff; border:1px solid rgba(0,200,255,.35); border-radius:22px; padding:10px 14px;
            font-family:'Courier New',monospace; font-size:14px; outline:none; user-select:text; }
  #textin:focus { box-shadow:0 0 10px rgba(0,200,255,.5); }
  .btn { background:rgba(0,40,60,.6); border:1px solid rgba(0,200,255,.5); color:var(--blue); border-radius:50%; width:44px; height:44px; font-size:18px; cursor:pointer; box-shadow:0 0 10px rgba(0,200,255,.25); }
  #controls { display:flex; align-items:center; justify-content:center; gap:28px; padding-top:2px; }
  #mic { width:76px; height:76px; font-size:30px; box-shadow:var(--glow); background:radial-gradient(circle,#06344a,#02121b); transition:transform .15s; }
  #mic:active { transform:scale(.94); }
  #mic.on { background:radial-gradient(circle,#0a7aa6,#02121b); animation:pulse 1s infinite; }
  @keyframes pulse { 0%,100% { box-shadow:0 0 14px rgba(0,200,255,.9), 0 0 0 0 rgba(0,200,255,.5);} 50% { box-shadow:0 0 28px rgba(0,200,255,1), 0 0 0 16px rgba(0,200,255,0);} }
  #settings { position:fixed; inset:0; background:rgba(0,0,0,.94); display:none; overflow-y:auto; padding:20px; z-index:10; }
  #settings.open { display:block; }
  #settings h2 { letter-spacing:4px; text-shadow:var(--glow); margin:4px 0 14px; font-size:18px; }
  #settings label { display:block; font-size:11px; letter-spacing:2px; margin:14px 0 4px; opacity:.85; }
  #settings input, #settings select { width:100%; background:#031821; color:#dff6ff; border:1px solid rgba(0,200,255,.4); border-radius:8px; padding:10px; font-size:14px; font-family:'Courier New',monospace; user-select:text; }
  #settings p { font-family:'Courier New',monospace; font-size:12px; color:#8fd8ee; line-height:1.4; margin:6px 0; }
  #settings a { color:#fff; }
  .row { display:flex; gap:10px; margin-top:18px; }
  .row button { flex:1; padding:12px; background:#06344a; color:var(--blue); border:1px solid var(--blue); border-radius:8px; font-family:'Orbitron',monospace; letter-spacing:2px; font-size:12px; }
</style>
</head>
<body>
<div id="app">
  <div id="clock">00:00<small>00</small></div>
  <div id="date"></div>
  <div id="greeting"></div>
  <div id="orbwrap"><canvas id="orb"></canvas></div>
  <div id="status">STANDBY</div>
  <div id="log"></div>
  <div id="bar">
    <input id="textin" type="text" placeholder="Type to JARVIS…" autocomplete="off" enterkeyhint="send">
    <button class="btn" id="send" aria-label="Send">➤</button>
  </div>
  <div id="controls">
    <button class="btn" id="stopbtn" aria-label="Stop speaking">■</button>
    <button class="btn" id="mic" aria-label="Microphone">🎤</button>
    <button class="btn" id="gear" aria-label="Settings">⚙</button>
  </div>
</div>

<div id="settings">
  <h2>SETTINGS</h2>
  <label>WHAT SHOULD I CALL YOU?</label>
  <input id="s-name" placeholder="sir">
  <label>AI BRAIN</label>
  <select id="s-provider">
    <option value="none">None (offline basics only)</option>
    <option value="gemini">Google Gemini (free key)</option>
    <option value="claude">Anthropic Claude (paid key)</option>
  </select>
  <p>Gemini: get a free key at <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>, then paste it below. The key is stored only on this phone.</p>
  <label>API KEY</label>
  <input id="s-key" type="password" placeholder="paste key here" autocomplete="off">
  <label>MODEL (leave blank for default)</label>
  <input id="s-model" placeholder="gemini-2.5-flash  /  claude-haiku-5-5">
  <label>LISTENING LANGUAGE</label>
  <input id="s-lang" placeholder="en-IN">
  <label>VOICE</label>
  <select id="s-voice"></select>
  <div class="row">
    <button id="s-test">TEST VOICE</button>
    <button id="s-save">SAVE</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

/* ---------- Settings ---------- */
const DEFAULTS = { name:'sir', provider:'none', key:'', model:'', lang:'en-IN', voice:'' };
let S = { ...DEFAULTS };
try { S = { ...DEFAULTS, ...JSON.parse(localStorage.getItem('jarvis') || '{}') }; } catch(e) {}
function saveSettings(){ try { localStorage.setItem('jarvis', JSON.stringify(S)); } catch(e) {} }

/* ---------- Clock & greeting ---------- */
const pad = n => String(n).padStart(2,'0');
function greetingText(){
  const h = new Date().getHours();
  const part = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  return part + ', ' + S.name + '.';
}
function tick(){
  const d = new Date();
  let h = d.getHours() % 12; if (h === 0) h = 12;
  $('clock').innerHTML = pad(h) + ':' + pad(d.getMinutes()) + '<small>' + pad(d.getSeconds()) + (d.getHours() < 12 ? ' AM' : ' PM') + '</small>';
  $('date').textContent = d.toLocaleDateString([], { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  $('greeting').textContent = greetingText();
}
tick(); setInterval(tick, 1000);

/* ---------- State & status ---------- */
let state = 'idle';
const LABELS = { idle:'STANDBY', listening:'LISTENING', thinking:'PROCESSING', speaking:'SPEAKING' };
const TARGET = { idle:0.25, listening:0.75, thinking:0.55, speaking:0.9 };
function setState(s){
  state = s;
  $('status').textContent = LABELS[s];
  $('mic').classList.toggle('on', s === 'listening');
}
